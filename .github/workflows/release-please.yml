name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update the release PR
        id: release
        uses: googleapis/release-please-action@v4

  # The tag release-please pushes uses GITHUB_TOKEN, so it never triggers
  # another workflow. Packaging has to happen in this run instead.
  package:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the new tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Extract release notes for this version
        run: |
          awk '/^## \[/ { if (seen) exit; seen = 1 } seen' CHANGELOG.md > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Package and Release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # The workflow runs on a branch push, so GITHUB_REF is refs/heads/main.
          # The packager then sees a tag on HEAD and skips with "Found future tag",
          # expecting a tag-push run that never comes (GITHUB_TOKEN pushes do not
          # trigger workflows). Override the ref so it packages as a tag build.
          GITHUB_REF: refs/tags/${{ needs.release-please.outputs.tag_name }}
          GITHUB_REF_NAME: ${{ needs.release-please.outputs.tag_name }}
